    <style>
        .page-hero {
            background: #080c10;
        }

        .page-hero::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 128px 128px;
        }

        /* ── Grid ── */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 3px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 4/3;
            overflow: hidden;
            cursor: pointer;
            background: #1c2430;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s ease;
            opacity: 0.88;
        }

        .photo-item:hover img {
            transform: scale(1.04);
            opacity: 1;
        }

        .photo-item-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0);
            display: flex;
            align-items: flex-end;
            padding: 1.25rem;
            transition: background 0.3s ease;
        }

        .photo-item:hover .photo-item-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 60%);
        }

        .photo-caption {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            color: white;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .photo-item:hover .photo-caption {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }

        .photo-download {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 2rem;
            height: 2rem;
            background: #2ecc71;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 3;
            text-decoration: none;
        }

        .photo-item:hover .photo-download {
            opacity: 1;
            transform: scale(1);
        }

        .photo-download:hover {
            background: #27ae60;
        }

        .photo-download svg {
            width: 1rem;
            height: 1rem;
            fill: black;
        }

        /* ── Lightbox ── */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            display: block;
            transform: scale(0.96);
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .lightbox.active .lightbox-img { transform: scale(1); }

        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.2s ease;
            padding: 0;
        }

        .lightbox-close:hover { color: white; }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 1rem;
            transition: color 0.2s ease, opacity 0.2s ease;
            line-height: 1;
        }

        .lightbox-img-wrap {
            position: relative;
            display: inline-flex;
        }

        .lightbox-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            padding: 0.3rem 0.6rem;
            background: rgba(0,0,0,0.65);
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 300;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            color: rgba(255,255,255,0.85);
        }

        .lightbox-nav:hover { color: white; }
        .lightbox-nav.hidden { opacity: 0; pointer-events: none; }
        .lightbox-prev { left: 1.5rem; }
        .lightbox-next { right: 1.5rem; }

        .lightbox-section-label {
            position: absolute;
            top: 2rem;
            left: 2.5rem;
            font-family: 'Jost', sans-serif;
            font-weight: 300;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.3);
        }
    </style>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightboxOnBg(event)">
    <span class="lightbox-section-label" id="lightbox-section"></span>
    <button class="lightbox-close" onclick="closeLightbox()">Close ✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" onclick="navigateLightbox(-1)">&#8592;</button>
    <div class="lightbox-img-wrap">
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
    </div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" onclick="navigateLightbox(1)">&#8594;</button>
</div>

<script>
    let currentIndex = 0;
    let currentItems = [];
    let currentSection = '';

    function updateNavArrows() {
        document.getElementById('lightbox-prev').classList.toggle('hidden', currentIndex === 0);
        document.getElementById('lightbox-next').classList.toggle('hidden', currentIndex === currentItems.length - 1);
    }

    function openLightbox(el, section) {
        const img = el.querySelector('img');
        const grid = document.querySelector(`[data-section-grid="${section}"]`);
        currentItems = Array.from(grid.querySelectorAll('.photo-item img'));
        currentIndex = currentItems.indexOf(img);
        currentSection = section;
        showImage(currentIndex);
        document.getElementById('lightbox-section').textContent = section;
        document.getElementById('lightbox').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function showImage(index) {
        const img = currentItems[index];
        document.getElementById('lightbox-img').src = img.src;
        document.getElementById('lightbox-img').alt = img.alt;
        updateNavArrows();
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('active');
        document.body.style.overflow = '';
    }

    function closeLightboxOnBg(e) {
        if (e.target === document.getElementById('lightbox')) closeLightbox();
    }

    function navigateLightbox(dir) {
        currentIndex = currentIndex + dir;
        showImage(currentIndex);
    }

    document.addEventListener('keydown', e => {
        if (!document.getElementById('lightbox').classList.contains('active')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft' && currentIndex > 0) navigateLightbox(-1);
        if (e.key === 'ArrowRight' && currentIndex < currentItems.length - 1) navigateLightbox(1);
    });
</script>
