<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Games — Rohan Hejmadi</title>
    <meta name="description" content="Games by Rohan Hejmadi — browser-based games built from scratch.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400&family=Oxanium:wght@600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.svg?v=5" type="image/svg+xml">
    <link rel="canonical" href="https://rohanhejmadi.com/games.html">
    <meta property="og:title" content="Games — Rohan Hejmadi">
    <meta property="og:description" content="Games by Rohan Hejmadi — browser-based games built from scratch.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rohanhejmadi.com/games.html">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        .project-card--mirror {
            position: relative;
            border-color: rgba(255,255,255,1);
            background: #080c1e;
            box-shadow: inset 0 0 0 4px #080c1e, inset 0 0 0 6px rgba(255,255,255,0.35);
        }

        .project-card--mirror:hover {
            border-color: rgba(255,255,255,1);
        }

        @keyframes retroSlide {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .project-card--mirror h2 {
            font-family: 'Oxanium', sans-serif;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
            text-align: center;
            margin-top: -10px;
            background: linear-gradient(90deg,
                #ff0000 0%,   #ff8800 7.14%, #ffff00 14.28%, #00ff88 21.42%,
                #00aaff 28.57%, #8844ff 35.71%, #ff2d55 42.85%,
                #ff0000 50%,  #ff8800 57.14%, #ffff00 64.28%, #00ff88 71.42%,
                #00aaff 78.57%, #8844ff 85.71%, #ff2d55 92.85%, #ff0000 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-stroke: 3px transparent;
            -webkit-text-fill-color: #080c1e;
            paint-order: stroke fill;
            overflow: visible;
            animation: retroSlide 4s linear infinite;
        }

        .project-card--mirror .btn {
            position: relative;
            z-index: 2;
            align-self: center;
            padding-top: 0.55rem;
            padding-bottom: 0.6rem;
            transform: translateY(0.25rem);
        }

        .project-card--mirror svg:not(.mirror-maze-bg) {
            position: absolute;
            top: calc(50% - 10px);
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

    </style>
</head>
<body>

<button class="btn-report">Report Bug</button>

<div class="page-hero">
    <a href="projects.html" class="back-btn">
        <span class="back-arrow">&#8592;</span>
        <span>Back</span>
    </a>

    <div class="page-content">
        <p class="eyebrow">Projects</p>
        <h1>Games</h1>
        <p class="subtitle">Browser-based games built from scratch.</p>

        <div class="projects-grid">
            <div class="project-card project-card--mirror">
                <svg id="mm-grid-svg" class="mirror-maze-bg" xmlns="http://www.w3.org/2000/svg" style="position:absolute;inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);pointer-events:none;">
                    <defs>
                        <pattern id="mm-grid" width="24" height="24" patternUnits="userSpaceOnUse">
                            <path id="mm-grid-path" d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#mm-grid)"/>
                </svg>
                <h2>Mirror Maze</h2>
                <a href="games/mirror_maze.html" target="_blank" class="btn" style="margin-top: auto; padding-left: 2.5rem; padding-right: 2.5rem;">Play!</a>
                <svg width="100" height="100" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="display:block;">
                    <defs>
                        <filter id="cgG" x="-60%" y="-60%" width="220%" height="220%">
                            <feGaussianBlur stdDeviation="3.5" result="b"/>
                            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                        <filter id="cgR" x="-60%" y="-60%" width="220%" height="220%">
                            <feGaussianBlur stdDeviation="3" result="b"/>
                            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                        <filter id="cgB" x="-60%" y="-60%" width="220%" height="220%">
                            <feGaussianBlur stdDeviation="3" result="b"/>
                            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <g transform="translate(0,11)">
                        <polyline points="15,175 15,5 100,85 185,5 185,175" stroke="#39FF14" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
                        <polyline points="15,175 15,5 100,85 185,5 185,175" stroke="#39FF14" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#cgG)"/>
                        <polyline points="38,175 38,44 100,118 162,44 162,175" stroke="#39FF14" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>
                        <polyline points="38,175 38,44 100,118 162,44 162,175" stroke="#39FF14" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#cgG)"/>
                        <polyline points="15,42 38,67 15,92 38,117 15,142 38,162" stroke="#ff2d55" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999" filter="url(#cgR)">
                            <animate attributeName="stroke-dasharray" values="0 9999;170 9999;0 9999;170 9999;0 9999" keyTimes="0;0.25;0.5;0.75;1" dur="4s" repeatCount="indefinite" calcMode="linear"/>
                            <animate attributeName="stroke-dashoffset" values="0;0;-170;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="4s" repeatCount="indefinite" calcMode="linear"/>
                        </polyline>
                        <polyline points="15,42 38,67 15,92 38,117 15,142 38,162" stroke="#ff2d55" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999" opacity="0.9">
                            <animate attributeName="stroke-dasharray" values="0 9999;170 9999;0 9999;170 9999;0 9999" keyTimes="0;0.25;0.5;0.75;1" dur="4s" repeatCount="indefinite" calcMode="linear"/>
                            <animate attributeName="stroke-dashoffset" values="0;0;-170;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="4s" repeatCount="indefinite" calcMode="linear"/>
                        </polyline>
                        <polyline points="162,162 185,142 162,117 185,92 162,67 185,42" stroke="#00aaff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999" filter="url(#cgB)">
                            <animate attributeName="stroke-dasharray" values="0 9999;170 9999;0 9999;170 9999;0 9999" keyTimes="0;0.25;0.5;0.75;1" dur="4s" repeatCount="indefinite" calcMode="linear"/>
                            <animate attributeName="stroke-dashoffset" values="0;0;-170;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="4s" repeatCount="indefinite" calcMode="linear"/>
                        </polyline>
                        <polyline points="162,162 185,142 162,117 185,92 162,67 185,42" stroke="#00aaff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0 9999" opacity="0.9">
                            <animate attributeName="stroke-dasharray" values="0 9999;170 9999;0 9999;170 9999;0 9999" keyTimes="0;0.25;0.5;0.75;1" dur="4s" repeatCount="indefinite" calcMode="linear"/>
                            <animate attributeName="stroke-dashoffset" values="0;0;-170;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="4s" repeatCount="indefinite" calcMode="linear"/>
                        </polyline>
                    </g>
                </svg>
            </div>
        </div>
    </div>
</div>

<script>
requestAnimationFrame(function() {
    const svg = document.getElementById('mm-grid-svg');
    const w = svg.clientWidth;
    const h = svg.clientHeight;
    const cols = Math.round(w / 24);
    const rows = Math.round(h / 24);
    const cw = w / cols;
    const ch = h / rows;
    const pat = document.getElementById('mm-grid');
    pat.setAttribute('width', cw);
    pat.setAttribute('height', ch);
    document.getElementById('mm-grid-path').setAttribute('d', `M ${cw} 0 L 0 0 0 ${ch}`);
});
</script>
<script src="scripts/report-bug.js"></script>
</body>
</html>
